<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event Model Viewer</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #0f172a; }
  .layout { display: flex; height: 100vh; }

  .sidebar {
    width: 280px;
    padding: 16px;
    border-right: 1px solid #e5e7eb;
    background: #fafafa;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar h2 {
    margin: 16px 0 4px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6b7280;
  }
  .sidebar h2:first-of-type { margin-top: 0; }
  .sidebar .model-name {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: #374151;
    margin-bottom: 12px;
    word-break: break-all;
  }
  .sidebar a {
    display: block;
    padding: 6px 10px;
    border-radius: 4px;
    color: #1f2937;
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 1px;
  }
  .sidebar a:hover { background: #eef2f7; }
  .sidebar a.active { background: #dbeafe; color: #1e3a8a; font-weight: 600; }

  .content {
    flex: 1;
    padding: 28px 36px;
    overflow-y: auto;
    line-height: 1.55;
  }
  .content h1 { margin-top: 0; font-size: 26px; }
  .content h2 { margin-top: 28px; font-size: 18px; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
  .content p, .content li { font-size: 14px; }
  .content em { color: #6b7280; }
  .content code { font-family: ui-monospace, monospace; font-size: 13px; }
  .content pre { background: #f3f4f6; padding: 10px 12px; border-radius: 4px; overflow-x: auto; }
  .content pre code { background: transparent; padding: 0; }
  .content pre.mermaid {
    background: #fafafa;
    border: 1px solid #e5e7eb;
    padding: 14px;
    overflow: auto;
  }
  .content pre.mermaid svg { display: block; }

  /* Code generation panel (one per slice, shown at the top of the content) */
  .codegen {
    margin: 0 0 24px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
  }
  .codegen-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #f8fafc;
    border-bottom: 1px solid #e5e7eb;
  }
  .codegen-bar .codegen-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #475569;
    margin-right: auto;
  }
  .codegen-bar button {
    font: inherit;
    font-size: 12px;
    line-height: 1;
    padding: 6px 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #fff;
    color: #1f2937;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .codegen-bar button:hover { background: #eef2f7; border-color: #9ca3af; }
  .codegen-bar button:active { background: #e5e7eb; }
  .codegen-bar button:disabled { opacity: 0.55; cursor: default; }
  .codegen-bar button.primary { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
  .codegen-bar button.primary:hover { background: #1e40af; }
  /* Qualified with .content so these win over the base `.content pre` rule
     (which would otherwise force a light background onto this <pre>). */
  .content pre.codegen-output {
    margin: 0;
    padding: 14px 16px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.5;
    max-height: 460px;
    overflow: auto;
    white-space: pre;
    tab-size: 2;
    border: none;
  }
  .content pre.codegen-output.empty {
    color: #94a3b8;
    font-style: italic;
    white-space: normal;
    background: #f8fafc;
  }

  /* Rendered blueprint (slice spec) preview inside the panel. */
  .codegen-preview { padding: 8px 16px 16px; }
  .codegen-preview .codegen-hint { color: #6b7280; font-style: italic; font-size: 13px; }
  .codegen-preview h1 { font-size: 20px; margin: 8px 0; }
  .codegen-preview h2 { font-size: 15px; margin-top: 18px; border-bottom: 1px solid #e5e7eb; padding-bottom: 3px; }
  .codegen-preview pre.mermaid { background: #fafafa; border: 1px solid #e5e7eb; padding: 12px; overflow: auto; }

  .empty { color: #6b7280; font-style: italic; margin-top: 40px; text-align: center; }
  .error {
    color: #991b1b;
    background: #fee2e2;
    border: 1px solid #fca5a5;
    padding: 12px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    white-space: pre-wrap;
  }
</style>
<script type="importmap">
{
  "imports": {
    "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm",
    "mermaid": "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs",
    "marked": "https://cdn.jsdelivr.net/npm/marked@15/+esm"
  }
}
</script>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <h2>Model</h2>
    <div class="model-name" id="model-name"></div>
    <div id="model-link"></div>
    <h2>Slices</h2>
    <div id="slice-list"></div>
  </nav>
  <main class="content" id="content">
    <div class="empty">Loading…</div>
  </main>
</div>

<script type="module">
import mermaid from 'mermaid';
import { marked } from 'marked';
import diagramDefinitions from './index.js';
import { generateSliceSpecFromModel } from './codegen.js';

await mermaid.registerExternalDiagrams(diagramDefinitions);
mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

// `model` is the base name; the conventions are:
//   <model>.md          → the model overview file (one per model)
//   <model>-slices/     → directory of per-slice spec files
const params = new URLSearchParams(location.search);
const MODEL = params.get('model') || 'blueprint_dsl_dcb';
const MODEL_FILE = MODEL + '.md';
const SLICES_DIR = MODEL + '-slices';
const POLL_MS = 1500;

document.getElementById('model-name').textContent = MODEL;

const modelLinkEl = document.getElementById('model-link');
const sliceListEl = document.getElementById('slice-list');
const content = document.getElementById('content');

// activeFile: either "__model" (for the wrapper) or "<slug>.md" (a slice spec).
let activeFile = params.get('file') || '__model';
let lastSrc = null;

async function listSliceFiles() {
  // Prefer a static manifest: hosts without directory listing (e.g. GitHub
  // Pages) can't be scraped, so CI writes an index.json of the slice files.
  try {
    const res = await fetch('./' + SLICES_DIR + '/index.json', { cache: 'no-store' });
    if (res.ok) {
      const files = await res.json();
      if (Array.isArray(files)) return [...files].sort();
    }
  } catch (_) { /* fall through to directory listing */ }
  // Fallback: scrape the auto-generated directory index (local `http.server`).
  try {
    const res = await fetch('./' + SLICES_DIR + '/', { cache: 'no-store' });
    if (!res.ok) return [];
    const html = await res.text();
    const matches = [...html.matchAll(/href="([^"]+\.md)"/g)];
    return [...new Set(matches.map((m) => decodeURIComponent(m[1])))].sort();
  } catch (_) {
    return [];
  }
}

async function loadActive() {
  const url = activeFile === '__model'
    ? './' + encodeURIComponent(MODEL_FILE)
    : './' + SLICES_DIR + '/' + encodeURIComponent(activeFile);
  const res = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error(`Could not load ${url}: ${res.status}`);
  return await res.text();
}

function makeLink(label, fileKey, urlValue) {
  const a = document.createElement('a');
  a.href = '?model=' + encodeURIComponent(MODEL) + '&file=' + encodeURIComponent(urlValue);
  a.textContent = label;
  if (fileKey === activeFile) a.classList.add('active');
  a.dataset.fileKey = fileKey;
  a.addEventListener('click', (e) => {
    e.preventDefault();
    activeFile = fileKey;
    history.replaceState(null, '', a.href);
    document.querySelectorAll('.sidebar a').forEach((x) => x.classList.remove('active'));
    a.classList.add('active');
    lastSrc = null;
    loadAndRender();
  });
  return a;
}

function renderSidebar(sliceFiles) {
  modelLinkEl.innerHTML = '';
  modelLinkEl.appendChild(makeLink(MODEL, '__model', '__model'));

  sliceListEl.innerHTML = '';
  if (sliceFiles.length === 0) {
    const note = document.createElement('div');
    note.style.cssText = 'color:#9ca3af;font-size:12px;padding:6px 10px;';
    note.textContent = '(no slice specs found)';
    sliceListEl.appendChild(note);
    return;
  }
  for (const f of sliceFiles) {
    const label = f.replace(/\.md$/, '');
    sliceListEl.appendChild(makeLink(label, f, f));
  }
}

// Build the blueprint panel for the active slice and insert it at the top of
// the content. It stamps the slice spec (Model · Intent · Tests) from the
// parent model — the forward `spec-slices` step of the reentrant lifecycle —
// and renders it inline. Code generation (binding the blueprint to a stack) is
// a separate downstream step, deliberately not in this viewer.
function attachCodegenPanel(container, sliceId) {
  const panel = document.createElement('div');
  panel.className = 'codegen';

  // ── Blueprint (the slice spec: Model · Intent · Tests) ────────────────────
  // The viewer produces the BLUEPRINT — the slice-spec markdown stamped from
  // the parent model (Model section derived; Description/Tests scaffolded for
  // the author). It never produces code: binding a blueprint to a stack
  // (Axon, AWS, …) is a downstream step outside this tool.
  const bpBar = document.createElement('div');
  bpBar.className = 'codegen-bar';
  const bpTitle = document.createElement('span');
  bpTitle.className = 'codegen-title';
  bpTitle.textContent = 'Blueprint · slice spec (Model · Intent · Tests)';
  bpBar.appendChild(bpTitle);

  const blueprintBtn = document.createElement('button');
  blueprintBtn.type = 'button';
  blueprintBtn.className = 'primary';
  blueprintBtn.textContent = 'Generate blueprint';

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.textContent = 'Copy markdown';
  copyBtn.disabled = true;

  const dlBtn = document.createElement('button');
  dlBtn.type = 'button';
  dlBtn.textContent = 'Download .md';
  dlBtn.disabled = true;

  bpBar.append(blueprintBtn, copyBtn, dlBtn);

  // A rendered-markdown region (not a <pre>): the stamped spec shows exactly as
  // the viewer renders any slice spec — the Model diagram plus Intent & Tests.
  const preview = document.createElement('div');
  preview.className = 'codegen-preview';
  preview.innerHTML = sliceId
    ? '<p class="codegen-hint">Generate this slice\u2019s blueprint: the spec ' +
      '(Model \u00b7 Intent \u00b7 Tests) stamped from the parent model. The Model ' +
      'section is derived; Description and Tests are yours to fill in.</p>'
    : '<p class="codegen-hint">Open a slice from the sidebar to generate its ' +
      'blueprint (Model \u00b7 Intent \u00b7 Tests).</p>';

  panel.append(bpBar, preview);
  container.insertBefore(panel, container.firstChild);

  if (!sliceId) { blueprintBtn.disabled = true; return panel; }

  const slug = sliceId.replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase();
  let generated = null;

  blueprintBtn.addEventListener('click', async () => {
    blueprintBtn.disabled = true;
    blueprintBtn.textContent = 'Generating\u2026';
    try {
      // Stamp the spec from the PARENT model (not the loaded slice file), so the
      // Model section is freshly derived — the reentrant forward step.
      const modelSrc = await fetchParentModel();
      generated = generateSliceSpecFromModel(modelSrc, { sliceId });
      await renderMarkdownInto(preview, generated);
      copyBtn.disabled = false;
      dlBtn.disabled = false;
    } catch (err) {
      console.error('blueprint generation failed', err);
      preview.innerHTML = '<div class="error">Blueprint generation failed:\n' +
        (err && err.stack ? err.stack : String(err)) + '</div>';
    } finally {
      blueprintBtn.disabled = false;
      blueprintBtn.textContent = 'Regenerate blueprint';
    }
  });

  copyBtn.addEventListener('click', async () => {
    if (generated == null) return;
    const label = copyBtn.textContent;
    try {
      await navigator.clipboard.writeText(generated);
      copyBtn.textContent = 'Copied';
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = generated;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); copyBtn.textContent = 'Copied'; }
      catch { copyBtn.textContent = 'Copy failed'; }
      ta.remove();
    }
    setTimeout(() => { copyBtn.textContent = label; }, 1400);
  });

  dlBtn.addEventListener('click', () => {
    if (generated == null) return;
    downloadText(generated, 'text/markdown;charset=utf-8', slug + '.md');
  });

  return panel;
}

// Fetch the parent model markdown (the file that declares the slices).
async function fetchParentModel() {
  const res = await fetch('./' + encodeURIComponent(MODEL_FILE) + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error(`Could not load parent model ${MODEL_FILE}: ${res.status}`);
  return await res.text();
}

// Render markdown into `el`: parse with marked, convert fenced mermaid blocks,
// and run mermaid on them. Shared by the model/slice view and the blueprint
// preview so a generated spec renders exactly like a loaded one.
async function renderMarkdownInto(el, md) {
  el.innerHTML = marked.parse(md);
  el.querySelectorAll('pre code.language-mermaid').forEach((code) => {
    const pre = code.parentElement;
    const newPre = document.createElement('pre');
    newPre.className = 'mermaid';
    newPre.textContent = code.textContent;
    pre.replaceWith(newPre);
  });
  const nodes = [...el.querySelectorAll('pre.mermaid')];
  if (nodes.length > 0) {
    try { await mermaid.run({ nodes }); }
    catch (err) { console.error('mermaid render error', err); }
  }
}

// Trigger a browser download of `text` with the given mime type and filename.
function downloadText(text, mime, filename) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function loadAndRender() {
  let src;
  try {
    src = await loadActive();
  } catch (err) {
    content.innerHTML = '<div class="error">' + (err.stack || err) + '</div>';
    return;
  }
  if (src === lastSrc) return;
  lastSrc = src;

  await renderMarkdownInto(content, src);

  const nodes = [...content.querySelectorAll('pre.mermaid')];
  if (nodes.length > 0) {
    // Wire slice-label chips to their spec files (upstream navigation).
    wireSliceLinks();

    // Code generation is per-slice: show one panel at the top of the content
    // whenever the source declares an eventModel block (slice specs and the
    // model overview). It reads the raw markdown (`src`), whose eventModel and
    // sliceTests blocks the generator extracts itself.
    if (/(^|\n)\s*eventModel\b/.test(src) || /```[\s\S]*?\beventModel\b/.test(src)) {
      // The blueprint panel stamps a slice spec from the parent model, so it
      // needs the slice id. On a slice view, read it from the file's
      // `<!-- slice id: X -->` comment; the model overview has no single slice.
      const idMatch = src.match(/<!--\s*slice id:\s*([\w-]+)\s*-->/);
      const sliceId = activeFile === '__model' ? null : (idMatch ? idMatch[1] : null);
      attachCodegenPanel(content, sliceId);
    }
  }
}

// The renderer stamps each slice group with the spec filename it corresponds
// to; routing to that file is the viewer's job, so the chips reuse the same
// navigation the sidebar links use.
function wireSliceLinks() {
  content.querySelectorAll('g.slice[data-slice-slug]').forEach((g) => {
    const slug = g.getAttribute('data-slice-slug');
    const chip = g.querySelector('.slice-label');
    if (!chip) return;
    chip.style.cursor = 'pointer';
    chip.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const link = document.querySelector(
        '.sidebar a[data-file-key="' + CSS.escape(slug) + '"]'
      );
      if (link) link.click();
    });
  });
}

try {
  const sliceFiles = await listSliceFiles();
  renderSidebar(sliceFiles);
  await loadAndRender();
} catch (err) {
  content.innerHTML = '<div class="error">' + (err.stack || err) + '</div>';
}

setInterval(loadAndRender, POLL_MS);
</script>
</body>
</html>
