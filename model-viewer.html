<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event Model Viewer</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #0f172a; }
  .layout { display: flex; height: 100vh; }

  .sidebar {
    width: 280px;
    padding: 16px;
    border-right: 1px solid #e5e7eb;
    background: #fafafa;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar h2 {
    margin: 16px 0 4px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6b7280;
  }
  .sidebar h2:first-of-type { margin-top: 0; }
  .sidebar .model-name {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: #374151;
    margin-bottom: 12px;
    word-break: break-all;
  }
  .sidebar a {
    display: block;
    padding: 6px 10px;
    border-radius: 4px;
    color: #1f2937;
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 1px;
  }
  .sidebar a:hover { background: #eef2f7; }
  .sidebar a.active { background: #dbeafe; color: #1e3a8a; font-weight: 600; }

  .content {
    flex: 1;
    padding: 28px 36px;
    overflow-y: auto;
    line-height: 1.55;
  }
  .content h1 { margin-top: 0; font-size: 26px; }
  .content h2 { margin-top: 28px; font-size: 18px; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
  .content p, .content li { font-size: 14px; }
  .content em { color: #6b7280; }
  .content code { font-family: ui-monospace, monospace; font-size: 13px; }
  .content pre { background: #f3f4f6; padding: 10px 12px; border-radius: 4px; overflow-x: auto; }
  .content pre code { background: transparent; padding: 0; }
  .content pre.mermaid {
    background: #fafafa;
    border: 1px solid #e5e7eb;
    padding: 14px;
    overflow: auto;
  }
  .content pre.mermaid svg { display: block; }

  /* Export toolbar shown above each rendered diagram */
  .diagram-wrap { position: relative; }
  .export-toolbar {
    display: flex;
    gap: 8px;
    margin: 0 0 6px;
  }
  .export-toolbar button {
    font: inherit;
    font-size: 12px;
    line-height: 1;
    padding: 6px 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #fff;
    color: #1f2937;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .export-toolbar button:hover { background: #f3f4f6; border-color: #9ca3af; }
  .export-toolbar button:active { background: #e5e7eb; }
  .export-toolbar button:disabled { opacity: 0.55; cursor: default; }
  .export-toolbar button svg { vertical-align: -2px; margin-right: 4px; }

  .empty { color: #6b7280; font-style: italic; margin-top: 40px; text-align: center; }
  .error {
    color: #991b1b;
    background: #fee2e2;
    border: 1px solid #fca5a5;
    padding: 12px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    white-space: pre-wrap;
  }
</style>
<script type="importmap">
{
  "imports": {
    "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm",
    "mermaid": "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs",
    "marked": "https://cdn.jsdelivr.net/npm/marked@15/+esm",
    "jspdf": "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/+esm"
  }
}
</script>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <h2>Model</h2>
    <div class="model-name" id="model-name"></div>
    <div id="model-link"></div>
    <h2>Slices</h2>
    <div id="slice-list"></div>
  </nav>
  <main class="content" id="content">
    <div class="empty">Loading…</div>
  </main>
</div>

<script type="module">
import mermaid from 'mermaid';
import { marked } from 'marked';
import diagramDefinitions from './index.js';

await mermaid.registerExternalDiagrams(diagramDefinitions);
mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

// ─────────────────────────────────────────────────────────────────────────
// Diagram export (PNG / PDF) — runs entirely client-side.
//
// The renderer emits <image href="settings.png"> for automation nodes.
// Browsers refuse to load external resources referenced inside an SVG that
// is rasterized via an <img>, so we inline settings.png as a data URI in a
// clone before drawing to a canvas. Rasterizing at 2x keeps text crisp.
// ─────────────────────────────────────────────────────────────────────────
const EXPORT_SCALE = 2;
let settingsIconDataUrl = null;

async function getSettingsIconDataUrl() {
  if (settingsIconDataUrl !== null) return settingsIconDataUrl;
  try {
    const res = await fetch('./settings.png', { cache: 'force-cache' });
    const blob = await res.blob();
    settingsIconDataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  } catch (_) {
    settingsIconDataUrl = ''; // give up gracefully; icons just won't appear
  }
  return settingsIconDataUrl;
}

// Determine the intrinsic pixel size of an SVG from its width/height or viewBox.
function svgSize(svg) {
  const w = parseFloat(svg.getAttribute('width'));
  const h = parseFloat(svg.getAttribute('height'));
  if (w && h) return { width: w, height: h };
  const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
  if (vb.length === 4 && vb[2] && vb[3]) return { width: vb[2], height: vb[3] };
  const rect = svg.getBoundingClientRect();
  return { width: rect.width || 800, height: rect.height || 600 };
}

// Clone the SVG, inline the automation icon, and return { blobUrl, width, height }.
async function svgToImageSource(svg) {
  const { width, height } = svgSize(svg);
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', width);
  clone.setAttribute('height', height);
  if (!clone.getAttribute('viewBox')) {
    clone.setAttribute('viewBox', `0 0 ${width} ${height}`);
  }

  // Inline the automation gear icon so it survives rasterization.
  const images = clone.querySelectorAll('image');
  if (images.length > 0) {
    const dataUrl = await getSettingsIconDataUrl();
    if (dataUrl) {
      images.forEach((img) => {
        img.setAttribute('href', dataUrl);
        img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', dataUrl);
      });
    }
  }

  // White backdrop so PNG/PDF aren't transparent.
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('x', 0);
  bg.setAttribute('y', 0);
  bg.setAttribute('width', width);
  bg.setAttribute('height', height);
  bg.setAttribute('fill', '#ffffff');
  clone.insertBefore(bg, clone.firstChild);

  const xml = new XMLSerializer().serializeToString(clone);
  const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + xml], {
    type: 'image/svg+xml;charset=utf-8',
  });
  return { blobUrl: URL.createObjectURL(blob), width, height };
}

// Rasterize an SVG element to a canvas at EXPORT_SCALE.
async function svgToCanvas(svg) {
  const { blobUrl, width, height } = await svgToImageSource(svg);
  try {
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('Failed to rasterize diagram'));
      image.src = blobUrl;
    });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(width * EXPORT_SCALE);
    canvas.height = Math.round(height * EXPORT_SCALE);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(EXPORT_SCALE, 0, 0, EXPORT_SCALE, 0, 0);
    ctx.drawImage(img, 0, 0, width, height);
    return { canvas, width, height };
  } finally {
    URL.revokeObjectURL(blobUrl);
  }
}

function triggerDownload(href, filename) {
  const a = document.createElement('a');
  a.href = href;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function exportBaseName(index) {
  const base = activeFile === '__model' ? MODEL : activeFile.replace(/\.md$/, '');
  return index > 0 ? `${base}-${index + 1}` : base;
}

async function exportPng(svg, index) {
  const { canvas } = await svgToCanvas(svg);
  const url = canvas.toDataURL('image/png');
  triggerDownload(url, exportBaseName(index) + '.png');
}

async function exportPdf(svg, index) {
  const { canvas, width, height } = await svgToCanvas(svg);
  const { jsPDF } = await import('jspdf');
  const orientation = width >= height ? 'landscape' : 'portrait';
  // Size the PDF page to the diagram (in px units) so nothing is cropped.
  const pdf = new jsPDF({ orientation, unit: 'px', format: [width, height] });
  pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, width, height);
  pdf.save(exportBaseName(index) + '.pdf');
}

// Build an export toolbar for a rendered diagram and insert it above the SVG.
function attachExportToolbar(pre, svg, index) {
  if (pre.previousElementSibling?.classList?.contains('export-toolbar')) return;

  const bar = document.createElement('div');
  bar.className = 'export-toolbar';

  const mkBtn = (label, handler) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = label;
    btn.addEventListener('click', async () => {
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Exporting…';
      try {
        await handler();
        btn.textContent = original;
      } catch (err) {
        console.error('export failed', err);
        btn.textContent = 'Failed';
        setTimeout(() => { btn.textContent = original; }, 1600);
      } finally {
        btn.disabled = false;
      }
    });
    return btn;
  };

  bar.appendChild(mkBtn('Export PNG', () => exportPng(svg, index)));
  bar.appendChild(mkBtn('Export PDF', () => exportPdf(svg, index)));
  pre.parentNode.insertBefore(bar, pre);
}

// `model` is the base name; the conventions are:
//   <model>.md          → the model overview file (one per model)
//   <model>-slices/     → directory of per-slice spec files
const params = new URLSearchParams(location.search);
const MODEL = params.get('model') || 'blueprint_dsl_dcb';
const MODEL_FILE = MODEL + '.md';
const SLICES_DIR = MODEL + '-slices';
const POLL_MS = 1500;

document.getElementById('model-name').textContent = MODEL;

const modelLinkEl = document.getElementById('model-link');
const sliceListEl = document.getElementById('slice-list');
const content = document.getElementById('content');

// activeFile: either "__model" (for the wrapper) or "<slug>.md" (a slice spec).
let activeFile = params.get('file') || '__model';
let lastSrc = null;

async function listSliceFiles() {
  // Prefer a static manifest: hosts without directory listing (e.g. GitHub
  // Pages) can't be scraped, so CI writes an index.json of the slice files.
  try {
    const res = await fetch('./' + SLICES_DIR + '/index.json', { cache: 'no-store' });
    if (res.ok) {
      const files = await res.json();
      if (Array.isArray(files)) return [...files].sort();
    }
  } catch (_) { /* fall through to directory listing */ }
  // Fallback: scrape the auto-generated directory index (local `http.server`).
  try {
    const res = await fetch('./' + SLICES_DIR + '/', { cache: 'no-store' });
    if (!res.ok) return [];
    const html = await res.text();
    const matches = [...html.matchAll(/href="([^"]+\.md)"/g)];
    return [...new Set(matches.map((m) => decodeURIComponent(m[1])))].sort();
  } catch (_) {
    return [];
  }
}

async function loadActive() {
  const url = activeFile === '__model'
    ? './' + encodeURIComponent(MODEL_FILE)
    : './' + SLICES_DIR + '/' + encodeURIComponent(activeFile);
  const res = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error(`Could not load ${url}: ${res.status}`);
  return await res.text();
}

function makeLink(label, fileKey, urlValue) {
  const a = document.createElement('a');
  a.href = '?model=' + encodeURIComponent(MODEL) + '&file=' + encodeURIComponent(urlValue);
  a.textContent = label;
  if (fileKey === activeFile) a.classList.add('active');
  a.dataset.fileKey = fileKey;
  a.addEventListener('click', (e) => {
    e.preventDefault();
    activeFile = fileKey;
    history.replaceState(null, '', a.href);
    document.querySelectorAll('.sidebar a').forEach((x) => x.classList.remove('active'));
    a.classList.add('active');
    lastSrc = null;
    loadAndRender();
  });
  return a;
}

function renderSidebar(sliceFiles) {
  modelLinkEl.innerHTML = '';
  modelLinkEl.appendChild(makeLink(MODEL, '__model', '__model'));

  sliceListEl.innerHTML = '';
  if (sliceFiles.length === 0) {
    const note = document.createElement('div');
    note.style.cssText = 'color:#9ca3af;font-size:12px;padding:6px 10px;';
    note.textContent = '(no slice specs found)';
    sliceListEl.appendChild(note);
    return;
  }
  for (const f of sliceFiles) {
    const label = f.replace(/\.md$/, '');
    sliceListEl.appendChild(makeLink(label, f, f));
  }
}

async function loadAndRender() {
  let src;
  try {
    src = await loadActive();
  } catch (err) {
    content.innerHTML = '<div class="error">' + (err.stack || err) + '</div>';
    return;
  }
  if (src === lastSrc) return;
  lastSrc = src;

  content.innerHTML = marked.parse(src);

  // marked emits <pre><code class="language-mermaid">. Convert to <pre class="mermaid">.
  content.querySelectorAll('pre code.language-mermaid').forEach((code) => {
    const pre = code.parentElement;
    const newPre = document.createElement('pre');
    newPre.className = 'mermaid';
    newPre.textContent = code.textContent;
    pre.replaceWith(newPre);
  });

  const nodes = [...content.querySelectorAll('pre.mermaid')];
  if (nodes.length > 0) {
    try {
      await mermaid.run({ nodes });
    } catch (err) {
      console.error('mermaid render error', err);
    }
    // Add PNG/PDF export controls to every diagram that rendered an SVG.
    content.querySelectorAll('pre.mermaid').forEach((pre, i) => {
      const svg = pre.querySelector('svg');
      if (svg) attachExportToolbar(pre, svg, i);
    });
  }
}

try {
  const sliceFiles = await listSliceFiles();
  renderSidebar(sliceFiles);
  await loadAndRender();
} catch (err) {
  content.innerHTML = '<div class="error">' + (err.stack || err) + '</div>';
}

setInterval(loadAndRender, POLL_MS);
</script>
</body>
</html>
