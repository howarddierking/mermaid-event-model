<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event Model Viewer</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #0f172a; }
  .layout { display: flex; height: 100vh; }

  .sidebar {
    width: 280px;
    padding: 16px;
    border-right: 1px solid #e5e7eb;
    background: #fafafa;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar h2 {
    margin: 16px 0 4px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6b7280;
  }
  .sidebar h2:first-of-type { margin-top: 0; }
  .sidebar .model-name {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: #374151;
    margin-bottom: 12px;
    word-break: break-all;
  }
  .sidebar a {
    display: block;
    padding: 6px 10px;
    border-radius: 4px;
    color: #1f2937;
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 1px;
  }
  .sidebar a:hover { background: #eef2f7; }
  .sidebar a.active { background: #dbeafe; color: #1e3a8a; font-weight: 600; }

  .content {
    flex: 1;
    padding: 28px 36px;
    overflow-y: auto;
    line-height: 1.55;
  }
  .content h1 { margin-top: 0; font-size: 26px; }
  .content h2 { margin-top: 28px; font-size: 18px; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
  .content p, .content li { font-size: 14px; }
  .content em { color: #6b7280; }
  .content code { font-family: ui-monospace, monospace; font-size: 13px; }
  .content pre { background: #f3f4f6; padding: 10px 12px; border-radius: 4px; overflow-x: auto; }
  .content pre code { background: transparent; padding: 0; }
  .content pre.mermaid {
    background: #fafafa;
    border: 1px solid #e5e7eb;
    padding: 14px;
    overflow: auto;
  }
  .content pre.mermaid svg { display: block; }

  /* Code generation panel (one per slice, shown at the top of the content) */
  .codegen {
    margin: 0 0 24px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
  }
  .codegen-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #f8fafc;
    border-bottom: 1px solid #e5e7eb;
  }
  .codegen-bar .codegen-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #475569;
    margin-right: auto;
  }
  .codegen-bar button {
    font: inherit;
    font-size: 12px;
    line-height: 1;
    padding: 6px 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #fff;
    color: #1f2937;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .codegen-bar button:hover { background: #eef2f7; border-color: #9ca3af; }
  .codegen-bar button:active { background: #e5e7eb; }
  .codegen-bar button:disabled { opacity: 0.55; cursor: default; }
  .codegen-bar button.primary { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
  .codegen-bar button.primary:hover { background: #1e40af; }
  /* Qualified with .content so these win over the base `.content pre` rule
     (which would otherwise force a light background onto this <pre>). */
  .content pre.codegen-output {
    margin: 0;
    padding: 14px 16px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.5;
    max-height: 460px;
    overflow: auto;
    white-space: pre;
    tab-size: 2;
    border: none;
  }
  .content pre.codegen-output.empty {
    color: #94a3b8;
    font-style: italic;
    white-space: normal;
    background: #f8fafc;
  }

  .empty { color: #6b7280; font-style: italic; margin-top: 40px; text-align: center; }
  .error {
    color: #991b1b;
    background: #fee2e2;
    border: 1px solid #fca5a5;
    padding: 12px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    white-space: pre-wrap;
  }
</style>
<script type="importmap">
{
  "imports": {
    "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm",
    "mermaid": "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs",
    "marked": "https://cdn.jsdelivr.net/npm/marked@15/+esm"
  }
}
</script>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <h2>Model</h2>
    <div class="model-name" id="model-name"></div>
    <div id="model-link"></div>
    <h2>Slices</h2>
    <div id="slice-list"></div>
  </nav>
  <main class="content" id="content">
    <div class="empty">Loading…</div>
  </main>
</div>

<script type="module">
import mermaid from 'mermaid';
import { marked } from 'marked';
import diagramDefinitions from './index.js';
import { generateFromSource, generateAwsFromSource, generateManifestFromSource } from './codegen.js';

await mermaid.registerExternalDiagrams(diagramDefinitions);
mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

// `model` is the base name; the conventions are:
//   <model>.md          → the model overview file (one per model)
//   <model>-slices/     → directory of per-slice spec files
const params = new URLSearchParams(location.search);
const MODEL = params.get('model') || 'blueprint_dsl_dcb';
const MODEL_FILE = MODEL + '.md';
const SLICES_DIR = MODEL + '-slices';
const POLL_MS = 1500;

document.getElementById('model-name').textContent = MODEL;

const modelLinkEl = document.getElementById('model-link');
const sliceListEl = document.getElementById('slice-list');
const content = document.getElementById('content');

// activeFile: either "__model" (for the wrapper) or "<slug>.md" (a slice spec).
let activeFile = params.get('file') || '__model';
let lastSrc = null;

async function listSliceFiles() {
  // Prefer a static manifest: hosts without directory listing (e.g. GitHub
  // Pages) can't be scraped, so CI writes an index.json of the slice files.
  try {
    const res = await fetch('./' + SLICES_DIR + '/index.json', { cache: 'no-store' });
    if (res.ok) {
      const files = await res.json();
      if (Array.isArray(files)) return [...files].sort();
    }
  } catch (_) { /* fall through to directory listing */ }
  // Fallback: scrape the auto-generated directory index (local `http.server`).
  try {
    const res = await fetch('./' + SLICES_DIR + '/', { cache: 'no-store' });
    if (!res.ok) return [];
    const html = await res.text();
    const matches = [...html.matchAll(/href="([^"]+\.md)"/g)];
    return [...new Set(matches.map((m) => decodeURIComponent(m[1])))].sort();
  } catch (_) {
    return [];
  }
}

async function loadActive() {
  const url = activeFile === '__model'
    ? './' + encodeURIComponent(MODEL_FILE)
    : './' + SLICES_DIR + '/' + encodeURIComponent(activeFile);
  const res = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error(`Could not load ${url}: ${res.status}`);
  return await res.text();
}

function makeLink(label, fileKey, urlValue) {
  const a = document.createElement('a');
  a.href = '?model=' + encodeURIComponent(MODEL) + '&file=' + encodeURIComponent(urlValue);
  a.textContent = label;
  if (fileKey === activeFile) a.classList.add('active');
  a.dataset.fileKey = fileKey;
  a.addEventListener('click', (e) => {
    e.preventDefault();
    activeFile = fileKey;
    history.replaceState(null, '', a.href);
    document.querySelectorAll('.sidebar a').forEach((x) => x.classList.remove('active'));
    a.classList.add('active');
    lastSrc = null;
    loadAndRender();
  });
  return a;
}

function renderSidebar(sliceFiles) {
  modelLinkEl.innerHTML = '';
  modelLinkEl.appendChild(makeLink(MODEL, '__model', '__model'));

  sliceListEl.innerHTML = '';
  if (sliceFiles.length === 0) {
    const note = document.createElement('div');
    note.style.cssText = 'color:#9ca3af;font-size:12px;padding:6px 10px;';
    note.textContent = '(no slice specs found)';
    sliceListEl.appendChild(note);
    return;
  }
  for (const f of sliceFiles) {
    const label = f.replace(/\.md$/, '');
    sliceListEl.appendChild(makeLink(label, f, f));
  }
}

// Build a code-generation panel for the active slice and insert it at the top
// of the content. Codegen is per-slice (it needs both the eventModel and
// sliceTests blocks), so there is exactly one panel, generated lazily on click.
function attachCodegenPanel(container, src, sliceName) {
  const panel = document.createElement('div');
  panel.className = 'codegen';

  const bar = document.createElement('div');
  bar.className = 'codegen-bar';

  const title = document.createElement('span');
  title.className = 'codegen-title';
  title.textContent = 'Code Generation';
  bar.appendChild(title);

  const genBtn = document.createElement('button');
  genBtn.type = 'button';
  genBtn.className = 'primary';
  genBtn.textContent = 'Generate Axon (Java)';

  // A second primary target: the AWS-native binding (CDK + Lambda, TypeScript).
  const awsBtn = document.createElement('button');
  awsBtn.type = 'button';
  awsBtn.className = 'primary';
  awsBtn.textContent = 'Generate AWS (CDK/TS)';

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.textContent = 'Copy';
  copyBtn.disabled = true;

  const dlBtn = document.createElement('button');
  dlBtn.type = 'button';
  dlBtn.textContent = 'Download';
  dlBtn.disabled = true;

  const manifestBtn = document.createElement('button');
  manifestBtn.type = 'button';
  manifestBtn.textContent = 'Download manifest.json';
  manifestBtn.disabled = true;

  bar.append(genBtn, awsBtn, copyBtn, dlBtn, manifestBtn);

  const output = document.createElement('pre');
  output.className = 'codegen-output empty';
  output.textContent = 'Generate Axon Framework 5 (Java) or AWS-native (CDK + Lambda, TypeScript) scaffolding from this slice — commands, events, a command handler (or projection/projector), and validation derived from the slice tests.';

  panel.append(bar, output);
  container.insertBefore(panel, container.firstChild);

  let generated = null;
  // The extension of the currently shown output ('java' or 'ts'), so Copy /
  // Download reflect whichever target was generated last.
  let generatedExt = 'java';
  // File base is conventionally PascalCase; derive one from the slice name.
  const fileBase = ((sliceName || 'slice').replace(/[^a-z0-9]+/gi, ' ').trim().split(/\s+/)
    .map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join('')) || 'Slice';

  // The two generators are independent: clicking one replaces the shown output.
  // `label` is the button's resting text; `ext` picks the download extension.
  const runGenerator = (btn, label, gen, ext) => {
    const original = btn.textContent;
    genBtn.disabled = true;
    awsBtn.disabled = true;
    btn.textContent = 'Generating…';
    try {
      generated = gen(src, { sliceName });
      generatedExt = ext;
      output.textContent = generated;
      output.classList.remove('empty');
      copyBtn.disabled = false;
      dlBtn.disabled = false;
      manifestBtn.disabled = false;
      dlBtn.textContent = 'Download .' + ext;
    } catch (err) {
      console.error('codegen failed', err);
      output.textContent = 'Code generation failed:\n' + (err && err.stack ? err.stack : String(err));
      output.classList.remove('empty');
    } finally {
      genBtn.disabled = false;
      awsBtn.disabled = false;
      btn.textContent = label;
    }
  };

  genBtn.addEventListener('click', () =>
    runGenerator(genBtn, 'Regenerate Axon (Java)', generateFromSource, 'java'));
  awsBtn.addEventListener('click', () =>
    runGenerator(awsBtn, 'Regenerate AWS (CDK/TS)', generateAwsFromSource, 'ts'));

  copyBtn.addEventListener('click', async () => {
    if (generated == null) return;
    const label = copyBtn.textContent;
    try {
      await navigator.clipboard.writeText(generated);
      copyBtn.textContent = 'Copied';
    } catch (_) {
      // Fallback for environments without the async clipboard API.
      const ta = document.createElement('textarea');
      ta.value = generated;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); copyBtn.textContent = 'Copied'; }
      catch { copyBtn.textContent = 'Copy failed'; }
      ta.remove();
    }
    setTimeout(() => { copyBtn.textContent = label; }, 1400);
  });

  dlBtn.addEventListener('click', () => {
    if (generated == null) return;
    const mime = generatedExt === 'ts'
      ? 'application/typescript;charset=utf-8'
      : 'text/x-java-source;charset=utf-8';
    const blob = new Blob([generated], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileBase + '.' + generatedExt;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  // The binding manifest: the stack-independent core (what a migration is
  // checked against) plus the disposable binding section. Generated on demand.
  manifestBtn.addEventListener('click', () => {
    const label = manifestBtn.textContent;
    try {
      const manifest = generateManifestFromSource(src, { sliceName });
      const blob = new Blob([manifest], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (sliceName || 'slice').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase() + '.manifest.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } catch (err) {
      console.error('manifest generation failed', err);
      manifestBtn.textContent = 'Failed';
      setTimeout(() => { manifestBtn.textContent = label; }, 1600);
    }
  });

  return panel;
}

async function loadAndRender() {
  let src;
  try {
    src = await loadActive();
  } catch (err) {
    content.innerHTML = '<div class="error">' + (err.stack || err) + '</div>';
    return;
  }
  if (src === lastSrc) return;
  lastSrc = src;

  content.innerHTML = marked.parse(src);

  // marked emits <pre><code class="language-mermaid">. Convert to <pre class="mermaid">.
  content.querySelectorAll('pre code.language-mermaid').forEach((code) => {
    const pre = code.parentElement;
    const newPre = document.createElement('pre');
    newPre.className = 'mermaid';
    newPre.textContent = code.textContent;
    pre.replaceWith(newPre);
  });

  const nodes = [...content.querySelectorAll('pre.mermaid')];
  if (nodes.length > 0) {
    try {
      await mermaid.run({ nodes });
    } catch (err) {
      console.error('mermaid render error', err);
    }

    // Code generation is per-slice: show one panel at the top of the content
    // whenever the source declares an eventModel block (slice specs and the
    // model overview). It reads the raw markdown (`src`), whose eventModel and
    // sliceTests blocks the generator extracts itself.
    if (/(^|\n)\s*eventModel\b/.test(src) || /```[\s\S]*?\beventModel\b/.test(src)) {
      const sliceName = activeFile === '__model' ? MODEL : activeFile.replace(/\.md$/, '');
      attachCodegenPanel(content, src, sliceName);
    }
  }
}

try {
  const sliceFiles = await listSliceFiles();
  renderSidebar(sliceFiles);
  await loadAndRender();
} catch (err) {
  content.innerHTML = '<div class="error">' + (err.stack || err) + '</div>';
}

setInterval(loadAndRender, POLL_MS);
</script>
</body>
</html>
