quarkus.application.name=hotel-web-api
quarkus.http.port=8080

# Allow the Vite dev server (default port 5173) to call the API in development.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173

# Axon Server connection (override via env: AXON_SERVER_HOST, AXON_SERVER_PORT)
axon.server.host=localhost
axon.server.port=8124
axon.server.context=default

# OpenTelemetry — endpoint is the Aspire dashboard's OTLP gRPC ingress.
# In docker-compose this becomes http://aspire-dashboard:18889; locally point
# at the host-published port via env (OTEL_EXPORTER_OTLP_ENDPOINT).
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
